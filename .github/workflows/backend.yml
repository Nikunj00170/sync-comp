name: Backend verification
on:
  push:
    paths: ['services/sync-backend/**', 'shared/data/catalogue.json', '.github/workflows/backend.yml']
  pull_request:
    paths: ['services/sync-backend/**', 'shared/data/catalogue.json', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/sync-backend/pom.xml
      - name: Verify backend
        working-directory: services/sync-backend
        run: ./mvnw --batch-mode clean verify
      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: sync-backend
          path: services/sync-backend/target/sync-backend-*.jar
          if-no-files-found: error
